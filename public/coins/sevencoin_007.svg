<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 256 256" role="img" aria-label="Moeda S 011 (simple)">
  <defs>
    <radialGradient id="gold" cx="30%" cy="28%" r="80%">
      <stop offset="0%"  stop-color="#FFE9A9"/>
      <stop offset="42%" stop-color="#FFC84D"/>
      <stop offset="100%" stop-color="#B96E08"/>
    </radialGradient>
    <linearGradient id="rimAngle" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(-30)">
      <stop offset="0%"   stop-color="#FFF3C2"/>
      <stop offset="55%"  stop-color="#F3C24A"/>
      <stop offset="100%" stop-color="#B57812"/>
    </linearGradient>
    <linearGradient id="grooveAngle" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(-30)">
      <stop offset="0%"   stop-color="#7A4305"/>
      <stop offset="100%" stop-color="#3B1F00"/>
    </linearGradient>
    <linearGradient id="grooveLight" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(-30)">
      <stop offset="0%"   stop-color="#FFE198"/>
      <stop offset="100%" stop-color="#D9A22E"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="60%"  stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- base da moeda sem filtros -->
  <circle cx="128" cy="128" r="112" fill="url(#gold)" stroke="#2F1600" stroke-width="6"/>
  <circle cx="128" cy="128" r="100" fill="none" stroke="url(#rimAngle)" stroke-width="10"/>
  <circle cx="128" cy="128" r="88"  fill="none" stroke="url(#grooveAngle)" stroke-width="7"/>
  <circle cx="128" cy="128" r="80"  fill="none" stroke="url(#grooveLight)" stroke-width="5" opacity="0.95"/>

  <!-- brilhos simples (sem clip/filter) -->
  <ellipse cx="186" cy="74" rx="24" ry="13" fill="url(#gloss)"/>
  <ellipse cx="82"  cy="200" rx="16" ry="9"  fill="#FFFFFF" opacity="0.26"/>

  <!-- S e número sem filtros -->
  <text x="128" y="116"
        text-anchor="middle" dominant-baseline="middle"
        font-family="Inter, ui-sans-serif, system-ui"
        font-weight="900" font-size="112"
        fill="#FFD973" stroke="#4E2A02" stroke-width="9" paint-order="stroke">
    S
  </text>

  <text x="128" y="176"
        text-anchor="middle" dominant-baseline="middle"
        font-family="Inter, ui-sans-serif, system-ui"
        font-weight="900" font-size="48"
        fill="#FFD973" stroke="#4E2A02" stroke-width="7" paint-order="stroke">
	011
  </text>
</svg>
